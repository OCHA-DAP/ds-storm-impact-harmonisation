name: Deploy exposure apps to GitHub Pages

# Builds one Pages site containing both apps:
#   /         — Cyclone Exposure Dashboard (from the gdacs-adam-data branch)
#   /compare/ — storm exposure comparison app (app/ + data exported from the DB)
# Data is shipped as a deploy artifact only — it is never committed to git.
#
# The DB export (~3 min) only runs on the schedule, on manual runs that opt in,
# or when no cached data exists; otherwise the last export is restored from the
# Actions cache, so app-only deploys take seconds.

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Re-export data from the database"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  push:
    branches: [main, compare-exposure-app] # TODO drop branch after merge; testing
    paths: ["app/**", ".github/workflows/deploy-app.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout dashboard branch (site root)
        uses: actions/checkout@v7
        with:
          ref: gdacs-adam-data
          path: dashboard

      - name: Restore cached app data
        uses: actions/cache/restore@v6
        with:
          path: app/data
          key: app-data-${{ github.run_id }} # never matches; always falls to restore-keys
          restore-keys: app-data-

      - name: Decide whether to refresh data
        id: refresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ inputs.refresh_data }}" = "true" ] \
             || [ ! -f app/data/core.json ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "Using cached data export"
          fi

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.refresh.outputs.refresh == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.refresh.outputs.refresh == 'true'
        run: uv sync --frozen

      - name: Export app data from database
        if: steps.refresh.outputs.refresh == 'true'
        env:
          DSCI_AZ_DB_DEV_HOST: ${{ secrets.DSCI_AZ_DB_DEV_HOST }}
          DSCI_AZ_DB_DEV_UID: ${{ secrets.DSCI_AZ_DB_DEV_UID }}
          DSCI_AZ_DB_DEV_PW: ${{ secrets.DSCI_AZ_DB_DEV_PW }}
        run: uv run python export_app_data.py

      - name: Save data cache
        if: steps.refresh.outputs.refresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: app/data
          key: app-data-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir -p site/compare
          rsync -a dashboard/index.html dashboard/assets site/
          rsync -a app/ site/compare/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
