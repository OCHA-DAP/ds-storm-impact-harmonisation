name: Deploy Pages site

# Builds one Pages site from the per-product manifests under pages/products/.
# The landing page and the routes are generated by pages/_build/assemble.py —
# this workflow does not name individual products. To add one, create a
# directory under pages/products/ with a page.toml; see pages/README.md.
#
# Exception: the comparison app's data comes from the database, which GitHub
# runners cannot reach (public access off since 2026-09-30). The export runs on
# a laptop over the DB tunnel and is parked on dev blob as one archive; this
# workflow downloads it. To refresh the data, see scripts/upload_app_data.py,
# then run this workflow by hand. Data ships as a deploy artifact only; it is
# never committed to git.
#
# No schedule: the data only changes when someone re-uploads it, and GitHub
# switches off scheduled workflows in repos with no recent activity, which
# also stops the push trigger.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "pages/**", ".github/workflows/deploy-app.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download app data from blob
        env:
          SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          set -o pipefail
          test -n "$SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          # Written by scripts/upload_app_data.py; keep the path in step with it.
          url="https://imb0chd0dev.blob.core.windows.net/projects/ds-storm-impact-harmonisation/processed/app_data/app_data.tar.gz"
          curl -fsS "$url?${SAS#\?}" | tar -xz -C app
          test -f app/data/core.json
          echo "app data: $(find app/data -type f | wc -l) files"

      # Standard library only, so no dependency install is needed.
      - name: Assemble site
        run: python3 pages/_build/assemble.py --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
