name: PDC Cyclone Poll

# PDC serves no archive and no track history — a cyclone detail object holds
# only the current advisory's forecast, so a storm's past exists solely in the
# polls we took at the time. Missed cycles are unrecoverable, which is why this
# runs unattended rather than on demand.
#
# Every 3 hours. The synoptic advisory cycle is 6-hourly (03/09/15/21 UTC), but
# PDC's ingest lag behind JTWC/NHC is not documented, so polling at twice the
# advisory rate avoids having to guess it. Over-polling is free: details are
# keyed on (uuid, updatedAt), so an unchanged hazard rewrites the same blob.
#
# `source_ref` selects which ref the poller runs from. It defaults to main and
# normally needs no thought; it exists so the poller can be exercised from a
# feature branch without merging first. (It originally carried a real
# indirection: GitHub only fires `schedule`/`workflow_dispatch` from the
# default branch, and the poller lived on a separate analysis trunk. That
# trunk has since merged into main.)
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/tag to run the poller from (default: main)"
        type: string
        default: main
      dry_run:
        description: "Fetch and report, but write nothing to blob"
        type: boolean
        default: false

env:
  # Scheduled runs cannot take inputs, so the default lives here too.
  SOURCE_REF_DEFAULT: main

# A late run must not overlap a still-running one; the newer poll is the
# useful one, but let the in-flight capture finish rather than truncating it.
concurrency:
  group: pdc-cyclone-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve source ref
        id: ref
        run: |
          REF="${{ github.event.inputs.source_ref }}"
          if [ -z "$REF" ]; then REF="$SOURCE_REF_DEFAULT"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Running poller from: $REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Fail early if the poller is not on that ref
        run: |
          if [ ! -f scripts/poll_pdc_cyclones.py ]; then
            echo "::error::scripts/poll_pdc_cyclones.py not found on \
          '${{ steps.ref.outputs.ref }}'. Point source_ref at a branch that \
          has it, or update SOURCE_REF_DEFAULT."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync

      - name: Poll PDC
        env:
          PDC_API_KEY: ${{ secrets.PDC_API_KEY }}
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run python scripts/poll_pdc_cyclones.py $ARGS
